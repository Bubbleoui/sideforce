<title>SideForce Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap">
<style>
/* Layout: sidebar (logo, views, pôles) + working area. Dark-first, committed to the SideForce look. */
:root{
  --bg:#1f1f1f; --panel:#262626; --panel2:#2c2c2c; --line:#3a3a3a;
  --ink:#ffffff; --mute:#9a9a9a; --lime:#c6f432; --on-lime:#111111; --black:#000000; --late:#ff6a5c;
  --font:'Roboto Condensed','Arial Narrow',Arial,sans-serif;
  --s0:#3b3b3b; --tint:rgba(255,255,255,.035);
  color-scheme:dark;
}
html[data-theme="clair"]{--bg:#eeeee8;--panel:#ffffff;--panel2:#f5f5f0;--line:#d8d8cf;--ink:#1b1b1b;--mute:#66665f;--lime:#4f7d00;--on-lime:#ffffff;--black:#e3e3db;--late:#d3322a;--s0:#cdcdc4;--tint:rgba(0,0,0,.035);color-scheme:light}
html[data-theme="flame"]{--bg:#1d1210;--panel:#281815;--panel2:#301d19;--line:#4d2e27;--ink:#fff3ec;--mute:#bb9d92;--lime:#ff7a1a;--on-lime:#1a0a04;--black:#0f0807;--late:#ff4d6d;--s0:#4a2f28;--tint:rgba(255,200,170,.04)}
html[data-theme="eau"]{--bg:#0e1b23;--panel:#142630;--panel2:#193240;--line:#28485a;--ink:#e9f8ff;--mute:#86abbd;--lime:#3fdccf;--on-lime:#04222a;--black:#06121a;--late:#ff7b6b;--s0:#27475a;--tint:rgba(170,230,255,.04)}
.lgl{fill:var(--lime)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;min-height:100%;padding-block:24px}
/* sidebar */
.side{display:flex;flex-direction:column;gap:18px;position:sticky;top:24px;align-self:start;height:calc(100vh - 48px);background:var(--panel);padding:18px 14px 14px;border:1px solid var(--line)}
.sbody{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:22px;margin:0 -6px;padding:0 6px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.sfoot{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.me{display:flex;align-items:center;gap:12px;min-width:0}
.me>div{min-width:0}
.me b{display:block;font-size:15px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:36px;height:36px;flex:none;background:var(--lime);color:var(--on-lime);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:18px;clip-path:polygon(14% 0,100% 0,86% 100%,0 100%)}
.sact{display:flex;gap:12px;flex-wrap:wrap}
.side .brand{gap:10px} .side .brand svg{width:54px} .side .brand b{font-size:22px}
.sact button{background:none;border:0;padding:2px 0;color:var(--mute);font-size:11px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.sact button:hover{color:var(--lime)}
.sact button[hidden]{display:none}
.side .nav button:hover,.side .poles button:hover{background:var(--panel2)}
.side .poles button[aria-pressed="true"]{background:var(--bg)}
.brand{display:flex;align-items:center;gap:14px}
.brand svg{width:76px;height:auto;flex:none}
.brand b{display:block;font-size:26px;line-height:1;letter-spacing:.02em;text-transform:uppercase}
.brand b em{font-style:normal;color:var(--lime)}
.brand span{display:block;margin-top:4px;color:var(--mute);letter-spacing:.14em;text-transform:uppercase;font-size:12px}
.lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0 0 8px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav .lbl{margin:14px 0 4px 2px} .nav .lbl:first-child{margin-top:0}
.nav button{justify-content:flex-start!important;gap:12px!important;border-left:3px solid transparent}
.nav button .ni{width:18px;height:18px;flex:none;opacity:.8}
.nav button[aria-current="true"] .ni{opacity:1}
.nav button:hover:not([aria-current="true"]){border-left-color:var(--lime)}
.nav button,.poles button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;
  background:transparent;border:0;border-left:4px solid transparent;padding:9px 12px;font-size:17px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink)}
.nav button:hover,.poles button:hover{background:var(--panel)}
.nav button[aria-current="true"]{background:var(--lime);color:var(--on-lime);font-weight:700}
.poles button{font-size:15px;text-transform:none;letter-spacing:.02em}
.poles button[aria-pressed="true"]{background:var(--panel2);border-left-color:var(--lime);font-weight:700}
.poles small{color:var(--mute)}
.sync{font-size:12px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.sync i{width:8px;height:8px;background:var(--mute);display:inline-block;transform:skewX(-20deg)}
.sync[data-s="ok"] i{background:var(--lime)} .sync[data-s="slow"] i{background:var(--late)}
.ghost{background:transparent;border:1px solid var(--line);padding:7px 12px;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.ghost:hover{border-color:var(--lime);color:var(--lime)}
.cta{background:var(--lime);color:var(--on-lime);border:0;padding:10px 18px;font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.cta:hover{filter:brightness(1.08)}
/* main */
.main{min-width:0;display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;justify-content:space-between}
.top h1{margin:0;font-size:clamp(44px,7vw,84px);line-height:.9;text-transform:uppercase;color:var(--lime);letter-spacing:.01em}
.top .sub{color:var(--mute);letter-spacing:.14em;text-transform:uppercase;font-size:13px;margin-top:8px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{background:var(--panel);border:1px solid var(--line);padding:9px 12px;min-width:200px;font-size:15px}
.search::placeholder{color:var(--mute)}
#view{min-width:0}
/* chips / selects */
select,input[type=text],input[type=date],input[type=url],textarea{background:var(--panel2);border:1px solid var(--line);padding:6px 8px;border-radius:0;color:var(--ink)}
select{appearance:none;-webkit-appearance:none;padding-right:22px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 12px) 55%,calc(100% - 8px) 55%;background-size:4px 4px;background-repeat:no-repeat;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:13px;cursor:pointer}
select option{background:var(--bg);color:var(--ink);text-transform:none;font-weight:400}
select[data-f="status"][data-k="0"]{background-color:var(--line);border-color:var(--line)}
select[data-f="status"][data-k="1"]{background-color:var(--lime);color:var(--on-lime);border-color:var(--lime)}
select[data-f="status"][data-k="2"]{background-color:var(--ink);color:var(--on-lime);border-color:var(--ink)}
select[data-f="prio"]{background-color:var(--panel2)}
select:disabled,input:disabled{opacity:.7;cursor:default}
input[type=date]{width:136px;color-scheme:dark} input[type=text]{width:100%}
.pb{display:inline-flex;gap:3px;margin-right:8px;vertical-align:middle}
.pb i{display:block;width:5px;height:15px;background:var(--line);transform:skewX(-20deg)}
.pb[data-n="3"] i,.pb[data-n="2"] i:nth-child(-n+2),.pb[data-n="1"] i:first-child{background:var(--lime)}
.tag{display:inline-block;margin-left:8px;padding:1px 6px;background:var(--late);color:var(--on-lime);font-size:11px;letter-spacing:.1em}
/* list */
.grp{margin-bottom:28px}
.grp-h{display:flex;align-items:center;gap:14px;background:var(--black);padding:10px 14px;margin-bottom:2px}
.grp-h h3{margin:0;font-size:22px;letter-spacing:.04em;text-transform:uppercase;color:var(--lime);flex:1}
.grp-h .cnt{color:var(--mute);font-size:14px;letter-spacing:.08em}
.tw{overflow-x:auto;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:860px}
th{text-align:left;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:400;padding:9px 10px;border-bottom:1px solid var(--line)}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.c-t{width:34%}
.tl{background:none;border:0;padding:0;text-align:left;font-size:17px;font-weight:700}
.tl:hover{color:var(--lime)}
.lk{margin-left:8px;color:var(--lime);text-decoration:none;font-weight:700}
.none{margin:0;padding:14px;color:var(--mute);background:var(--panel)}
/* kanban */
.kan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.kan.k2{grid-template-columns:repeat(2,minmax(0,1fr))} .kan.k4{grid-template-columns:repeat(4,minmax(0,1fr))} .kan.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.col.oc>h3{background:var(--line)} .col.oc[data-owner="Tout le monde"]>h3{background:var(--lime);color:var(--on-lime)}
.card.tk{flex-direction:row;align-items:flex-start;gap:10px;cursor:pointer}
.card.tk .tb{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.card.tk.done b{text-decoration:line-through;color:var(--mute)}
.ck{width:24px;height:24px;border:2px solid var(--mute);background:transparent;flex:none;padding:0;position:relative}
.ck:hover{border-color:var(--lime)} .ck.on{background:var(--lime);border-color:var(--lime)}
.ck.on::after{content:"";position:absolute;left:6px;top:1px;width:6px;height:13px;border:solid var(--on-lime);border-width:0 3px 3px 0;transform:rotate(45deg)}
#cmenu{position:fixed;z-index:300;min-width:210px;max-width:280px;background:var(--panel2);border:1px solid var(--lime);padding:6px 0;box-shadow:0 8px 28px rgba(0,0,0,.5)}
#cmenu[hidden],#m-statwrap[hidden]{display:none!important}
#cmenu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 16px;font-size:16px}
#cmenu button:hover,#cmenu button:focus-visible{background:var(--lime);color:var(--on-lime);outline:none}
#cmenu button.dg{color:var(--late)} #cmenu button.dg:hover{background:var(--late);color:#fff}
#cmenu .hd{padding:8px 16px 2px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
#cmenu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
#m-polechk[hidden],#m-polewrap[hidden]{display:none!important}
.chkl{display:flex!important;flex-direction:row!important;align-items:center;gap:10px;cursor:pointer}
.chkl input{width:18px;height:18px;accent-color:var(--lime);flex:none}
.chkl span{margin:0!important;text-transform:none!important;font-size:16px!important;letter-spacing:0!important;color:var(--ink)!important}
.bn{font-size:22px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.poles .pe{font-size:13px!important;color:var(--mute);padding-top:2px!important;padding-bottom:6px!important;text-transform:uppercase;letter-spacing:.06em}
.poles .pe:hover{color:var(--lime)}
.poles .addb{border:1px dashed var(--line)!important;color:var(--mute)}
.bsw{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);padding:8px 14px;font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;max-width:min(60vw,420px)}
.bsw:hover{border-color:var(--lime)} .bsw svg{width:16px;height:16px;flex:none;color:var(--lime)}
.bnew{border-color:var(--lime)!important;color:var(--lime)}
.bnew:hover{background:var(--lime);color:var(--on-lime)}
.rtabs{gap:10px!important}
.rhint .qb{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:18px;pointer-events:auto}
.rhint .qb span{color:var(--mute)}
.rhint .chip{background:var(--panel);border:1px solid var(--line);padding:8px 14px;text-transform:uppercase;letter-spacing:.06em;font-size:14px}
.rhint .chip:hover{border-color:var(--lime);color:var(--lime)}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:var(--line)} ::-webkit-scrollbar-thumb:hover{background:var(--mute)} ::-webkit-scrollbar-track{background:transparent}
.brand{cursor:pointer} .brand:hover b{color:var(--lime)}
.tgl{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--mute);font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:2px 0}
.tgl svg{width:16px;height:16px;flex:none} .tgl:hover{color:var(--lime)}
#cpBtn{font-size:12px;letter-spacing:.1em;padding:9px 12px;color:var(--mute)}
.mod{position:fixed;inset:0;z-index:250;background:rgba(0,0,0,.62);display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px}
.mod[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--lime);width:min(640px,100%);max-height:72vh;overflow:auto;box-shadow:0 18px 60px rgba(0,0,0,.6)}
#cpIn{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:18px 20px;font-size:22px;outline:none}
.cpi{display:flex;justify-content:space-between;gap:12px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:11px 20px;font-size:17px}
.cpi small{color:var(--mute);text-transform:uppercase;letter-spacing:.08em;font-size:12px;flex:none}
.cpi[aria-selected="true"]{background:var(--lime);color:var(--on-lime)} .cpi[aria-selected="true"] small{color:var(--on-lime)}
.cpn{padding:18px 20px;color:var(--mute)}
.kbox{padding:20px 24px} .kbox h2{margin:0 0 14px;font-size:26px;text-transform:uppercase;color:var(--lime)}
.kgrid{display:grid;grid-template-columns:auto 1fr;gap:8px 20px;align-items:baseline}
.kgrid kbd{background:var(--panel2);border:1px solid var(--line);padding:2px 8px;font:inherit;font-size:14px;white-space:nowrap}
.kgrid h4{grid-column:1/-1;margin:12px 0 0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
#toast .ta{margin-left:14px;background:none;border:0;border-bottom:2px solid var(--on-lime);padding:0;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:14px}
@media (min-width:901px){
  body.scol .shell{grid-template-columns:68px minmax(0,1fr)}
  body.scol .side{padding:14px 8px}
  body.scol .brand{justify-content:center} body.scol .brand>div,body.scol .nav .lbl,body.scol .nav button span,body.scol #polesBox,body.scol .me>div,body.scol .sync span,body.scol .sact,body.scol .tgl span{display:none}
  body.scol .nav button{justify-content:center!important;padding-left:0;padding-right:0}
  body.scol .brand svg{width:40px} body.scol .me{justify-content:center} body.scol .tgl{justify-content:center} body.scol .tgl svg{transform:rotate(180deg)} body.scol .sync{justify-content:center}
}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.sm{width:24px;height:24px;font-size:12px;display:inline-grid;vertical-align:middle;margin-right:8px}
.av.xl{width:104px;height:104px;font-size:48px;clip-path:polygon(10% 0,100% 0,90% 100%,0 100%)}
.me{cursor:pointer} .me:hover b{color:var(--lime)}
.pf-top{display:flex;align-items:center;gap:20px;margin-bottom:8px}
.pf-btns{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.pf-btns small{color:var(--mute)}
.pf-col>span{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
#pf-colors{display:flex;gap:8px;flex-wrap:wrap}
.pf-role{color:var(--mute);font-size:13px}
.hday{margin:22px 0 8px;font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.hrow{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;padding:10px 14px;background:var(--panel);border-left:3px solid var(--line);margin-bottom:4px;align-items:baseline}
.hrow time{color:var(--mute);font-size:14px}
.hrow b{text-transform:uppercase;letter-spacing:.04em;margin-right:6px}
.hrow.done{border-left-color:var(--lime)} .hrow.del{border-left-color:var(--late)}
.hrow .tl{display:inline;font-size:inherit;font-weight:400;text-align:left}
.eqbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.eqbar .sp{flex:1}
.eqbar .tg{background:var(--panel);border:1px solid var(--line);padding:9px 16px;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.eqbar .tg.on{background:var(--lime);border-color:var(--lime);color:var(--on-lime);font-weight:700}
.eqbar .who{color:var(--mute);font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.eqbar .who b{color:var(--ink)}
.eqbar .lnk{background:none;border:0;color:var(--mute);text-decoration:underline;padding:0 4px;font-size:14px}
.alert{background:var(--panel);border-left:4px solid var(--late);padding:14px 16px;margin-bottom:16px}
.alert h3{margin:0 0 10px;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.alert .al{display:flex;flex-wrap:wrap;gap:10px}
.alert .ai{background:var(--panel2);padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:140px}
.alert .ai b{font-size:17px;text-transform:uppercase;letter-spacing:.04em}
.alert .ai .r{color:var(--late);font-weight:700} .alert .ai span{font-size:14px;color:var(--mute)}
.cm{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.cm h3{margin:0 0 10px;font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.cmi{background:var(--panel2);padding:10px 12px;margin-bottom:8px}
.cmi small{color:var(--mute);display:flex;justify-content:space-between;gap:8px;text-transform:uppercase;letter-spacing:.04em}
.cmi small b{color:var(--ink)}
.cmi p{margin:4px 0 0;white-space:pre-wrap;word-break:break-word}
.cmi .dc{background:none;border:0;color:var(--mute);padding:0 2px}
.cmi .dc:hover{color:var(--late)}
.cmf{display:flex;gap:8px;margin-top:10px}
.cmf input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);padding:10px 12px}
.cmf input:focus{border-color:var(--lime);outline:none}
.col .addo{margin:4px 12px 0;width:calc(100% - 24px)}
.col{background:var(--panel);min-height:320px;padding-bottom:12px}
.col.over{outline:2px dashed var(--lime);outline-offset:-2px}
.col>h3{margin:0 0 12px;padding:12px 14px;font-size:22px;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between}
.col[data-s="0"]>h3{background:var(--line)} .col[data-s="1"]>h3{background:var(--lime);color:var(--on-lime)} .col[data-s="2"]>h3{background:var(--ink);color:var(--on-lime)}
.card{background:var(--panel2);margin:0 12px 10px;padding:12px;border:1px solid var(--line);cursor:grab;display:flex;flex-direction:column;gap:8px}
.card:hover{border-color:var(--lime)} .card.drag{opacity:.4}
.card b{font-size:17px;line-height:1.15}
.card .meta{display:flex;justify-content:space-between;gap:8px;color:var(--mute);font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.card .pole{color:var(--ink)}
/* gantt */
.gantt{overflow:auto;background:var(--panel);border:1px solid var(--line);max-height:74vh}
.g-inner{position:relative}
.g-row{display:flex;height:54px;border-bottom:1px solid var(--line)}
.g-row.head{height:28px;background:var(--black);border-bottom:0;position:sticky;top:0;z-index:5}
.g-row.head.w{top:28px;height:26px;z-index:4}
.g-row.head.dd{top:54px;height:24px;z-index:3}

.gbar{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:12px}

  try{localStorage.setItem("sf_view",view);if(curBoard)localStorage.setItem("sf_board",curBoard)}catch(e){}

    ensureBoard();

      var n=refs.filter(function(r){return r.board===b.id}).length,on=b.id===curBoard;
      return '<button data-bd="'+esc(b.id)+'" aria-pressed="'+on+'">'+esc(b.name)+' <small>'+n+'</small></button>'+(on&&canWrite?'<button class="pe" data-act="editboard" title="Renommer ce board" aria-label="Renommer ce board">✎ Renommer</button>':"");
    }).join("");

    pe.innerHTML=bh+(canWrite?'<button class="addb" data-act="newboard">+ Board</button>':"");
  }else pe.innerHTML='<button data-p="" aria-pressed="'+(fPole===""?"true":"false")+'">Tous <small>'+tasks.length+'</small></button>'+
    POLES.map(function(p){return '<button data-p="'+esc(p)+'" aria-pressed="'+(fPole===p?"true":"false")+'">'+esc(p)+' <small>'+(cnt[p]||0)+'</small></button>'}).join("");
  $("#addT").hidden=!canWrite||view==="refs"||view==="histo"||view==="story";
  $("#polesBox").style.display=view==="story"?"none":"";
  $("#q").placeholder=view==="story"?"Chercher dans l’histoire  ( / )":"Chercher une tâche  ( / )";
  $(".search").style.display=(view==="refs"||view==="histo")?"none":"";
  $("#exp").hidden=!downloads||!tasks.length;
  var sy=$("#sync");
  if(!dbOn){sy.dataset.s="slow";$("#syncTxt").textContent="Hors ligne"}
  else if(!loaded){sy.dataset.s="load";$("#syncTxt").textContent="Chargement"}
  else if(render.slow){sy.dataset.s="slow";$("#syncTxt").textContent="Connexion lente"}
  else{sy.dataset.s="ok";$("#syncTxt").textContent=canWrite?"Synchro en direct":"Lecture seule"}
  var prev=$("#gantt");if(prev)ganttLeft=prev.scrollLeft;
  if(!loaded&&dbOn){main.innerHTML='<div class="empty"><b>Chargement…</b>Récupération de la pipeline.</div>';return}
  if(view==="refs"){
    if(!dbOn){main.innerHTML=vEmpty();return}
    if(!boardsLoaded||!refsLoaded){main.innerHTML='<div class="empty"><b>Chargement…</b>Récupération des références.</div>';return}
    renderRefs();return;
  }
  if(view==="histo"){main.innerHTML=vHisto();return}
  if(view==="story"){main.innerHTML=vStory();syAfter();return}
  if(!tasks.length&&view!=="suivi"){main.innerHTML=vEmpty();return}
  if(!tasks.length&&view==="suivi"&&!miles.length){main.innerHTML=vEmpty();return}
  main.innerHTML=view==="equipe"?vEquipe():view==="gantt"?vGantt():view==="kanban"?vKanban():vSuivi();
  if(view==="gantt"){
    var g=$("#gantt");
    if(g){g.scrollLeft=ganttLeft!=null?ganttLeft:Math.max(0,(vGantt.t0-vGantt.lo-14)*DW)}
  }
}

/* gantt drag */
main.addEventListener("pointerdown",function(e){
  var bar=e.target.closest(".bar");if(!bar||!canWrite||e.button>0)return;
  var mode=e.target.classList.contains("l")?"l":e.target.classList.contains("r")?"r":"m";
  drag={bar:bar,mode:mode,x0:e.clientX,s0:+bar.dataset.s,e0:+bar.dataset.e,ds:0,de:0,moved:false,id:bar.closest("[data-id]").dataset.id};

main.addEventListener("pointermove",function(e){
  if(!drag)return;
  var dx=e.clientX-drag.x0;if(Math.abs(dx)>4)drag.moved=true;if(!drag.moved)return;
  var dd=Math.round(dx/DW),s=drag.s0,en=drag.e0;
  if(drag.mode==="m"){s+=dd;en+=dd}else if(drag.mode==="l"){s=Math.min(s+dd,en)}else{en=Math.max(en+dd,s)}
  drag.s=s;drag.en=en;
  var b=drag.bar;b.classList.add("dragging");
  b.style.left=((s-vGantt.lo)*DW)+"px";b.style.width=((en-s+1)*DW-2)+"px";
  b.querySelector(".bt").textContent=fmt(iso(s))+" → "+fmt(iso(en));
});
function endDrag(){
  if(!drag)return;var d=drag;drag=null;
  if(!d.moved){openTask(d.id);return}
  if(d.s!=null&&(d.s!==d.s0||d.en!==d.e0))patch(d.id,{start:iso(d.s),end:iso(d.en)});
  else render();
}
main.addEventListener("pointerup",endDrag);

var cmenu=document.createElement("div");cmenu.id="cmenu";cmenu.hidden=true;cmenu.setAttribute("role","menu");document.body.appendChild(cmenu);
var cmItems=[];
function hideMenu(){cmenu.hidden=true;cmItems=[]}
function showMenu(x,y,items){
  cmItems=items;
  cmenu.innerHTML=items.map(function(it,i){
    if(it.sep)return "<hr>";if(it.head)return '<div class="hd">'+esc(it.head)+"</div>";
    return '<button role="menuitem" data-ci="'+i+'"'+(it.danger?' class="dg"':"")+">"+esc(it.label)+"</button>";
  }).join("");
  cmenu.hidden=false;
  var w=cmenu.offsetWidth,h=cmenu.offsetHeight;
  cmenu.style.left=Math.max(4,Math.min(x,innerWidth-w-4))+"px";cmenu.style.top=Math.max(4,Math.min(y,innerHeight-h-4))+"px";
  var f=cmenu.querySelector("button");if(f)f.focus({preventScroll:true});
}
cmenu.addEventListener("click",function(e){
  var b=e.target.closest("[data-ci]");if(!b)return;
  var it=cmItems[+b.dataset.ci];if(!it)return;
  if(it.confirm&&!it.armed){it.armed=true;b.textContent="Confirmer : "+it.label.toLowerCase();return}
  hideMenu();it.fn();
});
cmenu.addEventListener("contextmenu",function(e){e.preventDefault()});
document.addEventListener("pointerdown",function(e){if(!cmenu.hidden&&!e.target.closest("#cmenu"))hideMenu()},true);
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!cmenu.hidden){hideMenu();e.stopPropagation()}},true);
window.addEventListener("blur",hideMenu);window.addEventListener("resize",hideMenu);window.addEventListener("scroll",hideMenu,true);
function taskItems(t){
  var id=t.id,it=[{label:"Ouvrir",fn:function(){openTask(id)}},{sep:1},{head:"Statut"}];
  STATUS.forEach(function(s){if(s!==t.status)it.push({label:s==="WIP"?"En cours (WIP)":s,fn:function(){patch(id,{status:s})}})});
  it.push({head:"Assigner à"});
  OWNERS.forEach(function(o){if(o!==t.owner)it.push({label:o,fn:function(){patch(id,{owner:o})}})});
  if(t.owner)it.push({label:"Retirer le responsable",fn:function(){patch(id,{owner:""})}});
  it.push({sep:1},{label:"Dupliquer",fn:function(){
    var c={};Object.keys(t).forEach(function(k){if(k!=="id")c[k]=t[k]});c.title=(t.title||"Tâche")+" (copie)";c.status="À faire";c.created=Date.now();
    var ref=taskCol.doc();enqueue("t"+ref.id,function(){return ref.set(c)}).then(function(){toast("Dupliquée")});logAct("a dupliqué « "+(t.title||"Tâche")+" »",ref.id);
  }});
  it.push({label:"Supprimer",danger:1,confirm:1,fn:function(){
    logAct("a supprimé « "+(t.title||"Tâche")+" »","");
    enqueue("t"+id,function(){return taskCol.doc(id).delete()}).then(function(){toast("Supprimé",undoTask(t))});
  }});
  return it;
}
function mileItems(m){
  var id=m.id,done=m.status==="Fini";
  return [{label:"Ouvrir",fn:function(){openMile(id)}},
    ].concat(hasStatus(m)?[{label:done?"Remettre à faire":"Marquer fait",fn:function(){enqueue("m"+id,function(){return mileCol.doc(id).update({status:done?"À faire":"Fini"})})}}]:[]).concat([
    {sep:1},{label:"Supprimer",danger:1,confirm:1,fn:function(){enqueue("m"+id,function(){return mileCol.doc(id).delete()}).then(function(){toast("Supprimé")})}}]);
}
document.addEventListener("contextmenu",function(e){
  if(!scrim.hidden||!canWrite)return;
  var t=e.target;if(!t.closest||t.closest("input,textarea,select,a,#cmenu,.lg"))return;
  var items=null;
  if(view==="refs"){
    if(penOn||!curBoard)return;
    var cv=$("#cv");if(!cv||!cv.contains(t)||t.closest("#pbar,#tools,#selbar,#mm,#bsr"))return;
    var ri=t.closest(".ri"),cnx=t.closest("g.cn"),cr=cv.getBoundingClientRect(),wx=(e.clientX-cr.left-rview.x)/rview.k,wy=(e.clientY-cr.top-rview.y)/rview.k;
    if(cnx){var cid=cnx.dataset.id;setSel([cid]);items=[{label:"Étiqueter…",fn:function(){labelConn(cid)}},{label:"Afficher/masquer la flèche",fn:function(){var r=itemById(cid);if(r)rUpd(cid,{arrow:r.arrow===false})}},{sep:1},{label:"Supprimer",danger:1,fn:delSel}]}
    else if(ri){
      var rid=ri.dataset.id;if(!selSet[rid])setSel([rid]);
      var many=selIds().length>1,sl=selItems().filter(function(r){return r.kind!=="conn"});
      items=[{label:"Copier",fn:function(){copySel(false)}},{label:"Dupliquer",fn:dupSel},{label:sl.every(function(r){return r.lock})?"Déverrouiller":"Verrouiller",fn:function(){var on=!sl.every(function(r){return r.lock});sl.forEach(function(r){rUpd(r.id,{lock:on})})}}]
        .concat(sl.length===2?[{label:"Relier les deux",fn:function(){addConn(sl[0].id,sl[1].id)}}]:[])
        .concat([{sep:1},{label:"Premier plan",fn:function(){var z=zRange()[1];selIds().forEach(function(id,i){rUpd(id,{z:z+1+i})})}},
        {label:"Arrière-plan",fn:function(){var z=zRange()[0];selIds().forEach(function(id,i){rUpd(id,{z:z-1-i})})}},
        {sep:1},{label:"Supprimer"+(many?" ("+selIds().length+")":""),danger:1,fn:delSel}]);
    }else{
      items=[{label:"Nouvelle note ici",fn:function(){addItem("note",wx,wy,{text:"Note"})}},{label:"Texte ici",fn:function(){addItem("text",wx,wy)}},{label:"Forme ici",fn:function(){addItem("shape",wx,wy)}},{label:"Cadre ici",fn:function(){addItem("frame",wx,wy)}},{label:"Carte tâche…",fn:openTaskPicker},{label:"Coller",fn:pasteClip},{label:"Ajouter une image…",fn:function(){$("#rfile").click()}},{label:"Dessiner",fn:function(){setPen(true)}},{sep:1},{label:"Tout voir",fn:fitView}];
    }
  }else{
    var mm=t.closest("[data-mid]");
    if(mm){var m=miles.filter(function(x){return x.id===mm.dataset.mid})[0];if(m)items=mileItems(m)}
    if(!items){
      var row=t.closest("[data-id]"),tk=row&&tasks.filter(function(x){return x.id===row.dataset.id})[0];
      if(tk){
        items=taskItems(tk);
        var tr=view==="gantt"&&t.closest(".g-track");
        if(tr&&!t.closest(".bar")){
          var day=vGantt.lo+Math.floor((e.clientX-tr.getBoundingClientRect().left)/DW),ds=new Date(day*864e5).toISOString().slice(0,10);
          items.push({sep:1},{label:"Ajouter un jalon le "+fmtY(ds),fn:function(){openMile(null,{date:ds})}});
        }
      }else if(view==="gantt"&&t.closest(".g-track")){
        var tr2=t.closest(".g-track"),day2=vGantt.lo+Math.floor((e.clientX-tr2.getBoundingClientRect().left)/DW),ds2=new Date(day2*864e5).toISOString().slice(0,10);
        items=[{label:"Ajouter un jalon le "+fmtY(ds2),fn:function(){openMile(null,{date:ds2})}},{label:"Ajouter une tâche",fn:function(){openTask(null)}}];
      }
    }
  }
  if(!items)return;
  e.preventDefault();showMenu(e.clientX,e.clientY,items);
});

/* ---------- boot ---------- */
var h0=location.hash.slice(1);
if(VIEWS[h0])view=h0;else{try{var lv=localStorage.getItem("sf_view");if(VIEWS[lv])view=lv}catch(e){}}
try{var lb=localStorage.getItem("sf_board");if(lb)curBoard=lb}catch(e){}
try{if(localStorage.getItem("sf_scol")==="1")document.body.classList.add("scol")}catch(e){}
render();
(function(){
  var c=window.claude;
  if(!c||!c.use){dbOn=false;render();return}
  var timer=setTimeout(function(){if(!loaded){render.slow=true;render()}},10000);
  Promise.all([c.use("db"),c.use("user"),c.use("downloads"),c.use("assets"),c.use("live")]).then(function(r){
    var db=r[0],user=r[1];downloads=r[2]||null;assets=r[3]||null;live=r[4]||null;
    if(!db){dbOn=false;clearTimeout(timer);render();return}
    try{if(user&&user.can){canWrite=user.can("data.write")!==false}}catch(e){}
    taskCol=db.collection("tasks");mileCol=db.collection("milestones");boardCol=db.collection("boards");refCol=db.collection("refs");comCol=db.collection("comments");actCol=db.collection("activity");
    actCol.onSnapshot(function(s){acts=s.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o});if(view==="histo")render()},function(){});profCol=db.collection("profiles");notifCol=db.collection("notifs");storyCol=db.collection("story");
    storyCol.onSnapshot(function(s){story=s.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o});if(view==="story")render()},function(){});
    notifCol.onSnapshot(function(s){var old={};notifs.forEach(function(n){old[n.id]=1});notifs=s.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o});updBell();if(!$("#np").hidden)drawNp();if(!nFirst)notifs.filter(function(n){return mineN(n)&&!n.read&&!old[n.id]}).forEach(function(n){toast((n.from||"?")+" "+n.text,{label:"Ouvrir",fn:function(){markRead(n.id);if(n.task)openTask(n.task)}});try{if(document.hidden&&window.Notification&&Notification.permission==="granted")new Notification("SideForce",{body:(n.from||"?")+" "+n.text,icon:"icons/icon-192.png"})}catch(x){}});nFirst=false},function(){});
    try{var me=user&&user.me&&user.me();if(me){uid=me.id||"";myEmail=me.email||""}}catch(e){}
    comCol.onSnapshot(function(s){comments=s.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o});render();refreshCm()},function(){});
    profCol.onSnapshot(function(s){profiles=s.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o});myProf=profByUid(uid);if(myProf&&myProf.theme&&!themeSynced){themeSynced=true;if(myProf.theme!==theme)applyTheme(myProf.theme)}if(myProf&&myProf.name&&myProf.name!==myName){myName=myProf.name;try{localStorage.setItem("sf_me",myName)}catch(x){}}render()},function(){});
    boardCol.onSnapshot(function(s){boards=s.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o});boardsLoaded=true;render()},function(){boardsLoaded=true;render()});
    refCol.onSnapshot(function(s){refs=s.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o});refsLoaded=true;render()},function(){refsLoaded=true;render()});
    var seen=0;
    var ok=function(){seen++;if(seen>=2){loaded=true;render.slow=false;clearTimeout(timer)}};
    var failed=false,bad=function(e){window.SF_ERR=(e&&e.message)||String(e||"");failed=true;dbOn=false;loaded=true;clearTimeout(timer);render()};
    var tFirst=true,mFirst=true;
    taskCol.onSnapshot(function(s){tasks=s.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o});if(tFirst){tFirst=false;ok()}else if(loaded&&!failed){}render()},bad);
    mileCol.onSnapshot(function(s){miles=s.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o});if(mFirst){mFirst=false;ok()}render()},bad);
  },function(){dbOn=false;render()});
})();
})();
</script>
